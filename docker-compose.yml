services:
  api:
    container_name: url-shortner-api
    build: api/
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    env_file:
      - ".env"
    volumes:
      - ./.env:/app/.env:ro
    ports:
      # Só no loopback: com TRUSTED_PROXIES em faixas privadas, expor a API na
      # rede deixaria clientes da LAN forjarem X-Forwarded-For.
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    networks:
      - url-shortner-network
  redis:
    container_name: url-shortner-redis
    image: redis
    # Sem porta publicada no host: só a API (mesma rede) acessa o Redis.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
      timeout: 3s
    networks:
      - url-shortner-network
  db:
    container_name: url-shortner-db
    image: postgres:18
    # Sem porta publicada no host: só a API (mesma rede) acessa o Postgres.
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      # postgres:18 usa /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - url-shortner-network
  # Novo: servidor de desenvolvimento do Vite (SPA)
  web:
    container_name: url-shortner-web
    build:
      web/
    expose:
      - "${WEB_PORT}"
    environment:
      VITE_API_BASE: /api
    networks:
      - url-shortner-network

  proxy:
    container_name: url-shortner-nginx
    image: nginx:latest
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - api
      - web
    ports:
      - "${PROXY_PORT:-80}:80"
    networks:
      - url-shortner-network
networks:
  url-shortner-network:
    driver: bridge
volumes:
  pgdata:
