# Senhas usadas na interpolação têm ${VAR:?mensagem}: sem elas o compose nem
# sobe. A API_KEY só é lida pela API (env_file) e o boot dela recusa chave
# vazia ou curta (config.Load).
services:
  api:
    container_name: url-shortner-api
    build: api/
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    env_file:
      - ".env"
    ports:
      # Só no loopback: com TRUSTED_PROXIES em faixas privadas, expor a API na
      # rede deixaria clientes da LAN forjarem X-Forwarded-For.
      - "127.0.0.1:${APP_PORT:?APP_PORT é obrigatória}:${APP_PORT}"
    healthcheck:
      # /healthz faz ping no Postgres; wget vem do busybox da imagem alpine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${APP_PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - url-shortner-network

  redis:
    container_name: url-shortner-redis
    # redis >= 7 é necessário (EXPIRE NX no rate limiter).
    image: redis:8-alpine
    # Sem porta publicada no host: só a API (mesma rede) acessa o Redis.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória (veja .env.example)}"]
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      # Com REDISCLI_AUTH o ping autentica; senha errada não devolve PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - url-shortner-network

  db:
    container_name: url-shortner-db
    image: postgres:18
    # Sem porta publicada no host: só a API (mesma rede) acessa o Postgres.
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER é obrigatória}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD é obrigatória (veja .env.example)}
      - POSTGRES_DB=${DB_NAME:?DB_NAME é obrigatória}
    volumes:
      # postgres:18 usa /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Variáveis do próprio container ($$ = não interpolar no compose).
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - url-shortner-network

  # nginx único: serve o build do front e faz proxy de /api/ e /r/ para a API.
  proxy:
    container_name: url-shortner-nginx
    build:
      context: proxy/
      additional_contexts:
        web: web/
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    environment:
      # Usada pelo template do nginx (upstream api:${APP_PORT}).
      - APP_PORT=${APP_PORT}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:80"
    networks:
      - url-shortner-network

networks:
  url-shortner-network:
    driver: bridge
volumes:
  pgdata:
